name: BigRocket CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release at the end

env:
  # One place for the whole workflow. The Gradle build reads the ABI list from
  # -PbrAbis, and the split-APK step reads it from here, so they cannot drift apart.
  ABIS: "arm64-v8a,armeabi-v7a"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # JDK 21: AGP 9.2 requires it. With JDK 17 the Gradle step dies before compiling
      # anything ("Android Gradle plugin requires Java 21").
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # The hosted runner's preinstalled Android SDK does not reliably include
      # very recent platforms/build-tools (compileSdk 37 here), and their
      # licenses are not pre-accepted. Without this step, "./gradlew assembleDebug"
      # fails with "You have not accepted the license agreements...".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the deprecated 'tools' package from the SDK repo
          # index (2026-09-15); the action's default `packages` input still
          # requests it, so the step fails before anything else runs. We only
          # ever used this step for cmdline-tools/platform-tools anyway -
          # platforms/build-tools/ndk are installed explicitly below.
          packages: "platform-tools"

      - name: Install required SDK platform & build-tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses || true

      - name: Install Rust toolchain and Android targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ---------------------------------------------------------------------------
      # Natives. Two scripts, in this order:
      #   stage-prebuilt-natives.sh - the libraries we do not compile ourselves
      #                               (libpsiphon.so, libxray.so, the runtime .so files).
      #                               THIS WAS MISSING and is why every run before
      #                               2026-11-12 failed at :app:verifyAetherEngineAssets
      #                               with "Missing Psiphon client for arm64-v8a".
      #   build-natives.sh / build-xray.sh - the ones we do compile; they run after and
      #                               keep what they produce (the stager never overwrites
      #                               an existing .so).
      # ---------------------------------------------------------------------------
      - name: Stage prebuilt natives (both ABIs)
        env:
          # Optional. Everything staged here comes from the *public* upstream release, so
          # no token is required; a PAT in NATIVES_TOKEN only avoids GitHub's anonymous
          # API rate limit. The workflow's own GITHUB_TOKEN is scoped to this repository
          # and cannot read another repository's release, which is why it is not used.
          GITHUB_TOKEN: ${{ secrets.NATIVES_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          scripts/stage-prebuilt-natives.sh

      - name: Prepare Aether native sources
        run: |
          chmod +x scripts/fetch-natives.sh scripts/build-natives.sh scripts/build-xray.sh
          scripts/fetch-natives.sh

      - name: Build Aether native cores
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: scripts/build-natives.sh all

      - name: Set up Go (Xray core)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Xray core
        env:
          ANDROID_API: 26
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: scripts/build-xray.sh

      - name: Verify natives for every shipped ABI
        run: |
          ok=1
          for abi in $(echo "$ABIS" | tr ',' ' '); do
            for lib in libaether.so libxray.so libpsiphon.so libhev-socks5-tunnel.so; do
              if [ ! -s "app/src/main/jniLibs/$abi/$lib" ]; then
                echo "::error::missing app/src/main/jniLibs/$abi/$lib"
                ok=0
              fi
            done
            if [ ! -s "app/src/main/assets/aether/$abi/libaether.so" ]; then
              echo "::error::missing app/src/main/assets/aether/$abi/libaether.so"
              ok=0
            fi
          done
          if [ ! -s app/src/main/assets/server_entries.txt ]; then
            echo "::error::missing app/src/main/assets/server_entries.txt"
            ok=0
          fi
          exit $((1 - ok))

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -PbrAbis="$ABIS" --no-daemon --stacktrace

      - name: Build release APKs (one per ABI)
        run: ./gradlew assembleRelease -PbrAbis="$ABIS" --no-daemon --stacktrace

      - name: Sign release APKs
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/37.0.0)"
          OUT=dist
          mkdir -p "$OUT"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "signing: using the repository's release key"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"
            STORE_PASS="${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD is not set}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
          else
            # No secret configured: still produce *installable* APKs with a throwaway
            # key, and say so in the release notes. An unsigned release APK cannot be
            # installed at all, which is worse than an honest test key.
            echo "signing: KEYSTORE_BASE64 is not set - generating a throwaway key"
            KS="$RUNNER_TEMP/test.jks"
            STORE_PASS="bigrocket"
            KEY_PASS="bigrocket"
            KEY_ALIAS="bigrocket"
            keytool -genkeypair -keystore "$KS" -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=BigRocket Test, OU=Test, O=BigRocket, L=Test, ST=Test, C=IR" >/dev/null
            echo "TEST_KEY=1" >> "$GITHUB_ENV"
          fi

          for abi in $(echo "$ABIS" | tr ',' ' '); do
            # AGP names split APKs after the ABI; fall back to the single universal
            # artifact if this build did not split.
            # AGP names a split APK app-<abi>-release[-unsigned].apk depending on whether
            # signing is configured in the build; take whichever exists instead of
            # guessing, so this step cannot fail on a naming change.
            apk=""
            for candidate in \
                "app/build/outputs/apk/release/app-$abi-release-unsigned.apk" \
                "app/build/outputs/apk/release/app-$abi-release.apk" \
                "app/build/outputs/apk/release/app-release-$abi.apk"; do
                if [ -s "$candidate" ]; then apk="$candidate"; break; fi
            done
            [ -n "$apk" ] || { echo "::error::no APK produced for $abi"; ls -l app/build/outputs/apk/release/; exit 1; }
            echo "signing $apk -> $OUT/BigRocket-$abi.apk"
            aligned="$OUT/BigRocket-$(date +%Y%m%d)-$abi-aligned.apk"
            final="$OUT/BigRocket-$abi.apk"
            "$BT/zipalign" -f -p 4 "$apk" "$aligned"
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" --ks-key-alias "${KEY_ALIAS:-bigrocket}" \
              --out "$final" "$aligned"
            "$BT/apksigner" verify "$final"
            rm -f "$aligned"
            echo "signed $final ($(stat -c%s "$final") bytes)"
          done
          ls -l "$OUT"

      - name: Collect checksums
        run: |
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: BigRocket-release-apks
          path: |
            dist/BigRocket-arm64-v8a.apk
            dist/BigRocket-armeabi-v7a.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # A downloadable APK that only lives in a workflow artifact needs a GitHub login
      # to fetch, so publish a proper release as well: the two APKs plus the checksums.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)"
          TAG="v${VERSION}-b${CODE}"
          # A heredoc, not NOTES="...". The notes contain a quoted phrase ("the flow dies..."),
          # and an inner double quote CLOSES a double-quoted shell string: the rest of the text
          # was then executed as commands and the step died with
          #     line 20: flow: command not found   (exit 127)
          # Everything between the delimiter below is literal, quotes and all; the delimiter is
          # UNQUOTED on purpose so ${VERSION} and ${CODE} still expand.
          NOTES="$(cat <<NOTES_EOF
          BigRocket ${VERSION} (versionCode ${CODE}) - address tunnel.

          FIXED: Xray WOULD NOT CONNECT THROUGH PSIPHON (broken since the stage was
          added in b9). The config written for the standalone Psiphon client omitted
          PropagationChannelId and SponsorId, which psiphon-tunnel-core requires -
          the client exited before opening its listener, so Direct + Xray never left
          through Psiphon. The config now mirrors the Aether engine's working
          launcher field for field (identity, remote server list + signature key,
          TCP-only chained protocols), the config file keeps owner-only permissions
          instead of being unreadable to the client itself, the client gets a CA
          store (SSL_CERT_DIR), and the stage is only called ready once it reports
          a real tunnel - not merely an open socket. Full detail, in Persian:
          docs/PsiphonXrayFix-fa.md.

          PSIPHON IN THE Direct + Xray MODE (from b9):
          Xray's core has no --psiphon switch, so the hop is a standalone libpsiphon.so
          listening on 127.0.0.1:1821 as the ENTRY of the chain and dialling Xray on :1839
          through UpstreamProxyURL:

            TUN/hev -> psiphon 127.0.0.1:1821 -> socks5 -> Xray :1839 -> outbound
                    (dialerProxy=bonding-chain) -> network

          Off by default, region automatic by default, optional country from ExitRegions.
          UDP and DNS stay on Xray; a Psiphon local proxy is TCP only. Each chain is owned
          by exactly one mechanism - XrayPsiphonHop for Direct + Xray, the engine's own
          PsiphonHop for every chain containing Aether - so no chain can get two hops.

          THREE TUNNEL BUGS FIXED, all of them 'the flow dies and never recovers':
            1. The replay cache was shallower than the receive window (128 chunks kept vs
               189 needed), so a hole early in a fast burst could never be filled. Both
               ends now derive the depth from the window.
            2. A NACK was only sent when a DATA frame arrived. If a frame was lost and the
               sender then filled the window, it stopped sending - so no repair was ever
               asked for. A watchdog now re-checks open streams every 100 ms.
            3. The NACK budget was counted per stream, not per hole, so after six holes
               anywhere in a tunnel's life repairs stopped entirely. It resets per hole.

          ONE TLS STREAM OVER TWO RADIOS (measured, SeparatorTlsOverAddressTunnelTest):
            1 radio  =  8.05 Mbps (2084 ms)
            2 radios = 16.61 Mbps (1010 ms)   ->  2.06x, radios used 2/2
          A real TLS 1.3 connection is fragmented by the address tunnel, carried over Wi-Fi
          and cellular at once, reassembled and verified byte-for-byte - no CA, no
          interception. Each radio is capped at 1 MB/s in the test so the radios, not
          loopback, are the bottleneck. The two-radio TLS suite failed 3 of 8 runs before
          the tunnel fixes and passes 10 of 10 after them; bandwidth is unchanged.

          Two architectures in one release:
            BigRocket-arm64-v8a.apk    - 64-bit ARM (most phones from 2017 on)
            BigRocket-armeabi-v7a.apk  - 32-bit ARM (older / low-end phones)

          Install the one that matches the phone. If unsure, the armeabi-v7a build also
          runs on 64-bit devices.

          Full notes: docs/PsiphonOverXray-fa.md, docs/TwoRadiosOneTlsStream.md and
          docs/RELEASE-1.6-address-tunnel.md in the source tree.
          Test suite: 26 suites / 226 tests. A live connection to the Psiphon network is
          not covered by the tests - it needs a handset. Look for the log line
          'psiphon stage live on 127.0.0.1:1821 -> 1839' on first run.
          NOTES_EOF
          )"
          if [ "${TEST_KEY:-0}" = "1" ]; then
            NOTES="$NOTES

          NOTE: these APKs are signed with a THROWAWAY test key (no KEYSTORE_BASE64
          secret is configured). Uninstall any previous BigRocket before installing
          this one - Android refuses an update signed with a different key."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "BigRocket ${VERSION} (${CODE})" \
              --notes "$NOTES"
          fi
          echo "release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
